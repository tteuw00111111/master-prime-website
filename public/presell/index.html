<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    ============================================================
    GOOGLE ADS COMPLIANCE NOTES
    ============================================================

    Esta pagina foi criada seguindo as diretrizes do Google Ads:

    1. SEM REDIRECTS AUTOMATICOS
       - Nenhum meta refresh
       - Nenhum JavaScript que force navegacao
       - Nenhum redirect HTTP

    2. NAVEGACAO POR ESCOLHA DO USUARIO
       - Todos os links sao clicaveis manualmente
       - Nenhum popup ou modal automatico
       - Usuario decide para onde ir

    3. CONTEUDO TRANSPARENTE
       - Texto visivel e legivel
       - Sem conteudo oculto
       - Sem cloaking ou user-agent detection

    4. LINGUAGEM NEUTRA
       - Sem promessas absolutas
       - Sem precos ou garantias especificas
       - Sem termos sensiveis (diagnostico garantido, conserto imediato)

    ============================================================
  -->

  <!-- SEO Meta Tags - Genericos e informativos -->
  <title>Atendimento - Master Prime | Rio de Janeiro</title>
  <meta name="description" content="Entre em contato com a Master Prime. Atendimento personalizado para suas necessidades. Rio de Janeiro.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Atendimento - Master Prime">
  <meta property="og:description" content="Entre em contato com a Master Prime. Atendimento personalizado.">
  <meta property="og:locale" content="pt_BR">

  <!-- Preconnect para WhatsApp (melhora performance do clique) -->
  <link rel="preconnect" href="https://api.whatsapp.com">
  <link rel="dns-prefetch" href="https://api.whatsapp.com">

  <!-- Preload logo (above the fold) -->
  <link rel="preload" href="/presell/logo.webp" as="image" type="image/webp">

  <!--
    CSS INLINE para maxima performance
    Nenhuma dependencia externa = carregamento instantaneo
  -->
  <style>
    /* Reset minimo */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Variaveis de design */
    :root {
      --color-bg: #0A0A0A;
      --color-surface: #151515;
      --color-gold: #FFD700;
      --color-gold-light: #FFED4E;
      --color-white: #FFFFFF;
      --color-gray: #9CA3AF;
      --color-whatsapp: #25D366;
      --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    /* Base */
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--color-bg);
      color: var(--color-white);
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height para mobile */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Container principal */
    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Logo */
    .logo {
      margin-bottom: 32px;
    }

    .logo img {
      height: 56px;
      width: auto;
      display: block;
      margin: 0 auto;
    }

    @media (min-width: 480px) {
      .logo img {
        height: 72px;
      }
    }

    /* Headline principal */
    .headline {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      color: var(--color-white);
      margin-bottom: 40px;
      line-height: 1.2;
    }

    /* Container dos botoes */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Estilo base dos botoes */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 50px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Botao principal - WhatsApp */
    .btn-primary {
      background-color: var(--color-whatsapp);
      color: var(--color-white);
      border-color: var(--color-whatsapp);
    }

    .btn-primary:hover,
    .btn-primary:focus {
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
      transform: translateY(-2px);
    }

    .btn-primary:focus {
      outline: 2px solid var(--color-whatsapp);
      outline-offset: 2px;
    }

    /* Botao secundario - Site */
    .btn-secondary {
      background-color: transparent;
      color: var(--color-gray);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover,
    .btn-secondary:focus {
      color: var(--color-white);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-secondary:focus {
      outline: 2px solid var(--color-white);
      outline-offset: 2px;
    }

    /* Icone do WhatsApp (SVG inline para evitar dependencias) */
    .icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* Footer discreto */
    .footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .footer a {
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
    }

    .footer a:hover {
      color: rgba(255, 255, 255, 0.6);
    }

    /* Acessibilidade - respeita preferencia de movimento reduzido */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }

    /* Ajustes para telas muito pequenas */
    @media (max-width: 360px) {
      body {
        padding: 16px;
      }

      .btn {
        padding: 14px 24px;
        font-size: 0.9375rem;
      }
    }
  </style>
</head>

<body>
  <main class="container" role="main">
    <!-- Logo -->
    <div class="logo">
      <img src="/presell/logo.webp" alt="Master Prime" width="180" height="72">
    </div>

    <!--
      HEADLINE: Neutra e acolhedora
      Evita termos tecnicos, precos ou promessas
    -->
    <h1 class="headline">
      Estamos aqui para ajudar.
    </h1>

    <!--
      BOTOES DE ACAO
      - Primario: WhatsApp (conversao principal)
      - Secundario: Site (alternativa)

      IMPORTANTE: Ambos sao links normais, sem JS redirect
    -->
    <div class="actions">
      <!--
        CTA PRINCIPAL: WhatsApp
        Usando api.whatsapp.com (mais compativel que wa.me)
        Mensagem neutra sem mencionar servicos especificos

      <a
        href="https://api.whatsapp.com/send/?phone=5521967635340&text=Ol%C3%A1%21%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es.&type=phone_number&app_absent=0"
        class="btn btn-primary"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir conversa no WhatsApp"
      >

        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Falar com um atendente
      </a>

      <!--
        CTA SECUNDARIO: Site principal
        Link direto, sem redirect
      -->
      <a
        href="https://master-prime.com"
        class="btn btn-secondary"
        aria-label="Visitar o site principal"
      >
        Acessar o site
      </a>
    </div>

    <!-- Footer discreto com localizacao -->
    <footer class="footer">
      <p>Campo Grande, RJ</p>
    </footer>
  </main>

</body>
