    <script>
    window.__MP_IPHONE_PURCHASE = /^\/orcamento\/iphone\/?$/.test(location.pathname);
    if (window.__MP_IPHONE_PURCHASE) {
      var purchaseParams = new URLSearchParams(location.search);
      var safePurchaseParams = new URLSearchParams();
      var purchaseRules = {
        view: /^quote$/,
        model: /^iphone-(?:13|14|15|16|17|18)(?:-plus|-pro|-pro-max)?$/,
        capacity: /^(?:128|256|512)$/, condition: /^(?:used|sealed)$/,
        utm_source: /^[a-z0-9_-]{1,80}$/, utm_medium: /^[a-z0-9_-]{1,80}$/,
        utm_campaign: /^[a-z0-9_-]{1,80}$/, utm_content: /^\d{5,30}$/,
        campaign_id: /^\d{5,30}$/, adset_id: /^\d{5,30}$/
      };
      Object.keys(purchaseRules).forEach(function(key) {
        var value = purchaseParams.get(key);
        if (value && purchaseRules[key].test(value)) safePurchaseParams.set(key, value);
      });
      var purchaseQuery = safePurchaseParams.toString();
      try { history.replaceState(history.state, '', location.pathname + (purchaseQuery ? '?' + purchaseQuery : '')); } catch (_) {}
    }
    </script>
